name: unifye
description: Communnication app that is for university students to meet and communicate with each other.

publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  http_parser: ^4.0.0

flutter:
  uses-material-design: true
  default-flavor: development

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8            # ← Add this (code generator)
  freezed: ^2.4.7                 # ← Add this (freezed generator)
  json_serializable: ^6.8.0       # ← Add this (JSON code generator)
  flutter_lints: ^3.0.0
